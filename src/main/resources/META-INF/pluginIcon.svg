<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="40" height="40">
  <defs>
    <!-- Arka plan için derinlikli koyu gradyan -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>

    <!-- SSH/Terminal yeşili için neon gradyan -->
    <linearGradient id="terminalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="100%" stop-color="#60efff"/>
    </linearGradient>

    <!-- Bağlantı/Kablo turuncusu/sarısı (uzak sunucu hissi için) -->
    <linearGradient id="plugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>

    <!-- Parlama efekti için filtre -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Arka Plan (Modern Yuvarlatılmış Kare - VS Code / IDE eklenti standartlarına uygun) -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bgGrad)" stroke="#313244" stroke-width="8"/>

  <g transform="translate(0, 10)">
    <!-- Terminal Prompt Simgesi (>_) -->
    <g filter="url(#glow)">
      <!-- Sol İşaret (>) -->
      <path d="M 120 176 L 192 248 L 120 320" 
            fill="none" 
            stroke="url(#terminalGrad)" 
            stroke-width="32" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
      
      <!-- Alt Çizgi İmleci (_) -->
      <path d="M 232 320 L 320 320" 
            fill="none" 
            stroke="url(#terminalGrad)" 
            stroke-width="28" 
            stroke-linecap="round"/>
    </g>

    <!-- Uzak Bağlantı / Priz (Plug) Teması - Sağ üstte ağ/bağlantı vurgusu -->
    <g transform="translate(60, -20)">
      <!-- Bağlantı Düğümü / Çıkış Noktası -->
      <circle cx="340" cy="180" r="32" fill="url(#plugGrad)"/>
      <circle cx="340" cy="180" r="14" fill="#1e1e2e"/>
      
      <!-- Bağlantı Sinyal Dalgaları (Wi-Fi / Ağ hissi) -->
      <path d="M 380 150 A 50 50 0 0 1 380 210" 
            fill="none" 
            stroke="#ff9900" 
            stroke-width="12" 
            stroke-linecap="round" 
            opacity="0.8"/>
      <path d="M 405 130 A 75 75 0 0 1 405 230" 
            fill="none" 
            stroke="#ff9900" 
            stroke-width="10" 
            stroke-linecap="round" 
            opacity="0.4"/>
    </g>

    <!-- SSH Güvenlik Kalkanı / Bağlantı Noktası Detayı (Merkezde zarif bir nokta) -->
    <circle cx="280" cy="248" r="8" fill="#00ff87" opacity="0.6"/>
  </g>
</svg>
